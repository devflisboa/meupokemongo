services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - .:/app
      - "C:/Users/felipe.lisboa/Downloads/Telegram Desktop:/videos:ro"
    depends_on:
      - db

volumes:
  mysql_data:
