{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
  <div class="bg-white rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <svg viewBox="0 0 64 64" class="w-14 h-14 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="#E5E5E5"/>
        <path d="M 2 32 A 30 30 0 0 1 62 32 Z" fill="#CC0000"/>
        <circle cx="32" cy="32" r="30" fill="none" stroke="#1B2A4A" stroke-width="2.5"/>
        <rect x="2" y="28" width="60" height="8" fill="#1B2A4A"/>
        <rect x="15" y="47" width="7" height="8" rx="1" fill="#1B2A4A"/>
        <rect x="25" y="42" width="7" height="13" rx="1" fill="#1B2A4A"/>
        <rect x="35" y="37" width="7" height="18" rx="1" fill="#1B2A4A"/>
        <circle cx="32" cy="32" r="7.5" fill="white"/>
        <circle cx="32" cy="32" r="7.5" fill="none" stroke="#1B2A4A" stroke-width="2.5"/>
      </svg>
      <h1 class="text-2xl font-black text-gray-900">Entrar</h1>
      <p class="text-xs text-gray-400 mt-1">Sua coleção. Sua evolução. Suas trocas.</p>
    </div>

    <form method="post" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">Usuário</label>
        <input type="text" name="username" required autofocus
          class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="seu_usuario" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">Senha</label>
        <input type="password" name="password" required
          class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="••••••••" />
      </div>
      <button type="submit"
        class="w-full bg-[#1B2A4A] hover:opacity-90 text-white font-bold py-2.5 rounded-lg transition-opacity text-sm mt-2">
        Entrar
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      Não tem conta?
      <a href="{{ url_for('auth.registro') }}" class="text-blue-600 hover:underline font-semibold">Cadastrar grátis</a>
    </p>
  </div>
</div>
{% endblock %}
