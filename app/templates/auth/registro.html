{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
  <div class="bg-white rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <svg viewBox="0 0 64 64" class="w-14 h-14 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="#E5E5E5"/>
        <path d="M 2 32 A 30 30 0 0 1 62 32 Z" fill="#CC0000"/>
        <circle cx="32" cy="32" r="30" fill="none" stroke="#1B2A4A" stroke-width="2.5"/>
        <rect x="2" y="28" width="60" height="8" fill="#1B2A4A"/>
        <rect x="15" y="47" width="7" height="8" rx="1" fill="#1B2A4A"/>
        <rect x="25" y="42" width="7" height="13" rx="1" fill="#1B2A4A"/>
        <rect x="35" y="37" width="7" height="18" rx="1" fill="#1B2A4A"/>
        <circle cx="32" cy="32" r="7.5" fill="white"/>
        <circle cx="32" cy="32" r="7.5" fill="none" stroke="#1B2A4A" stroke-width="2.5"/>
      </svg>
      <h1 class="text-2xl font-black text-gray-900">Criar conta</h1>
      <p class="text-xs text-gray-400 mt-1">Junte-se à comunidade de treinadores.</p>
    </div>

    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">Usuário</label>
        <input type="text" name="username" required autofocus maxlength="50"
          class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="seu_usuario" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">E-mail</label>
        <input type="email" name="email" required
          class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="voce@email.com" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">Senha</label>
        <div class="relative">
          <input type="password" name="password" required minlength="8" id="registro-password"
            class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 pr-10"
            placeholder="mínimo 8 caracteres" />
          <button type="button" aria-label="Mostrar senha"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
            onclick="(function(btn){var inp=document.getElementById('registro-password');var show=inp.type==='password';inp.type=show?'text':'password';btn.querySelector('.icon-eye').classList.toggle('hidden',show);btn.querySelector('.icon-eye-off').classList.toggle('hidden',!show);})(this)">
            <svg class="icon-eye w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg class="icon-eye-off w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres</p>
      </div>
      <button type="submit"
        class="w-full bg-[#1B2A4A] hover:opacity-90 text-white font-bold py-2.5 rounded-lg transition-opacity text-sm mt-2">
        Criar conta grátis
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      Já tem conta?
      <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline font-semibold">Entrar</a>
    </p>
  </div>
</div>
{% endblock %}
