{% extends "base.html" %}
{% block title %}Admin — Sync Pokédex{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
  <a href="{{ url_for('admin.index') }}" class="text-gray-400 hover:text-gray-600 transition-colors">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
  </a>
  <div>
    <h1 class="text-xl font-black text-gray-900">Sincronizar Pokédex</h1>
    <p class="text-xs text-gray-400">Importa dados da PokeAPI para o banco local</p>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <!-- Configuração -->
  <div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4">
      <h2 class="font-bold text-sm text-gray-700 mb-4">Configurações</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide">Limite (quantidade)</label>
          <input type="number" id="limit" value="151" min="1" max="1025"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide">Offset (início)</label>
          <input type="number" id="offset" value="0" min="0"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-100 space-y-2">
        <div class="flex gap-2">
          <button onclick="startSync()" id="btnStart"
            class="flex-1 bg-[#1B2A4A] hover:opacity-90 text-white font-bold py-2 rounded-lg text-sm transition-opacity">
            Iniciar sync
          </button>
          <button onclick="stopSync()" id="btnStop" disabled
            class="flex-1 bg-red-100 hover:bg-red-200 text-red-600 font-bold py-2 rounded-lg text-sm transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            Parar
          </button>
        </div>
        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="preset(151,0)" class="text-xs bg-gray-100 hover:bg-gray-200 rounded px-2 py-1.5 font-semibold text-gray-600">Ger. 1</button>
          <button onclick="preset(100,151)" class="text-xs bg-gray-100 hover:bg-gray-200 rounded px-2 py-1.5 font-semibold text-gray-600">Ger. 2</button>
          <button onclick="preset(1025,0)" class="text-xs bg-gray-100 hover:bg-gray-200 rounded px-2 py-1.5 font-semibold text-gray-600">Todos</button>
        </div>
      </div>
    </div>

    <!-- Status card -->
    <div id="statusCard" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 hidden">
      <h3 class="font-bold text-sm text-gray-700 mb-3">Resultado</h3>
      <div id="statusBody" class="space-y-2 text-sm"></div>
    </div>
  </div>

  <!-- Log area -->
  <div class="lg:col-span-2">
    <div class="bg-[#0f1923] rounded-2xl overflow-hidden shadow-sm border border-gray-800">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700">
        <div class="flex items-center gap-2">
          <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-gray-600"></div>
          <span class="text-xs text-gray-400 font-mono" id="statusText">Aguardando...</span>
        </div>
        <button onclick="clearLog()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Limpar</button>
      </div>
      <div id="logArea"
        class="h-96 overflow-y-auto p-4 font-mono text-xs text-green-400 space-y-0.5 scroll-smooth">
        <div class="text-gray-600">— Pronto para sincronizar —</div>
      </div>
    </div>
  </div>
</div>

<script>
let es = null;

function preset(limit, offset) {
  document.getElementById('limit').value = limit;
  document.getElementById('offset').value = offset;
}

function log(text, color) {
  const area = document.getElementById('logArea');
  const line = document.createElement('div');
  line.className = color || 'text-green-400';
  line.textContent = text;
  area.appendChild(line);
  area.scrollTop = area.scrollHeight;
}

function clearLog() {
  document.getElementById('logArea').innerHTML = '';
}

function setStatus(running) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  if (running) {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse';
    txt.textContent = 'Sincronizando...';
    btnStart.disabled = true;
    btnStart.classList.add('opacity-50', 'cursor-not-allowed');
    btnStop.disabled = false;
  } else {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-600';
    btnStart.disabled = false;
    btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
    btnStop.disabled = true;
  }
}

function startSync() {
  const limit = document.getElementById('limit').value;
  const offset = document.getElementById('offset').value;
  clearLog();
  document.getElementById('statusCard').classList.add('hidden');
  setStatus(true);
  document.getElementById('statusText').textContent = 'Conectando...';

  log(`> flask db sync --limit ${limit} --offset ${offset}`, 'text-yellow-400');

  es = new EventSource(`{{ url_for('admin.sync_run') }}?limit=${limit}&offset=${offset}`);

  es.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.line !== undefined) {
      log(data.line);
    }
    if (data.error) {
      log('ERRO: ' + (data.error || 'timeout'), 'text-red-400');
      setStatus(false);
      document.getElementById('statusText').textContent = 'Erro';
      es.close();
    }
    if (data.done) {
      const r = data.report || {};
      log('', 'text-gray-600');
      log('─'.repeat(40), 'text-gray-600');
      log(`✓ Concluído — criados: ${r.created||0} | atualizados: ${r.updated||0} | erros: ${r.errors||0}`, 'text-cyan-400');

      setStatus(false);
      document.getElementById('statusText').textContent = 'Concluído';

      const card = document.getElementById('statusCard');
      document.getElementById('statusBody').innerHTML = `
        <div class="flex justify-between"><span class="text-gray-500">Criados</span><span class="font-bold text-green-600">${r.created||0}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Atualizados</span><span class="font-bold text-blue-600">${r.updated||0}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Erros</span><span class="font-bold text-red-500">${r.errors||0}</span></div>
      `;
      card.classList.remove('hidden');
      es.close();
    }
  };

  es.onerror = function() {
    log('Conexão encerrada.', 'text-gray-500');
    setStatus(false);
    document.getElementById('statusText').textContent = 'Desconectado';
    es.close();
  };
}

function stopSync() {
  if (es) {
    es.close();
    log('— Interrompido pelo usuário —', 'text-yellow-400');
    setStatus(false);
    document.getElementById('statusText').textContent = 'Parado';
  }
}
</script>
{% endblock %}
