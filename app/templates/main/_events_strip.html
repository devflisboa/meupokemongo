{# Eventos do GO em faixa deslizante (Início logado e página de apresentação) — card completo #}
<div class="flex gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-1 px-1" id="home-eventos">
  {% for ev in game_events %}
  <a href="{{ ev.url }}" target="_blank" rel="noopener"
    class="snap-start flex-shrink-0 w-72 flex flex-col bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-shadow group">
    <div class="relative h-36 bg-gray-200 overflow-hidden">
      <img src="{{ ev.image_url }}" alt="{{ ev.title }}" loading="lazy"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/10 to-transparent"></div>
      <span class="absolute top-2 left-2 text-[10px] font-bold uppercase tracking-wide bg-black/50 text-white backdrop-blur-sm px-2 py-0.5 rounded-full">{{ ev.category }}</span>
      <p class="absolute bottom-2 left-3 right-3 text-white font-black text-sm leading-tight line-clamp-2 drop-shadow">{{ ev.title }}</p>
    </div>
    <div class="p-3 flex-1 flex flex-col">
      <div class="flex items-center gap-1.5 text-[11px] font-bold text-gray-600">
        <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        {{ ev.date }}
      </div>
      {# descrição inteira — antes cortada em 2 linhas #}
      <p class="text-xs text-gray-600 leading-snug mt-1.5 flex-1">{{ ev.description }}</p>
      <div class="mt-3 flex items-center justify-between">
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full {{ ev.badge }}">{{ ev.category }}</span>
        <span class="text-[11px] font-bold text-blue-600 group-hover:underline">Saiba mais →</span>
      </div>
    </div>
  </a>
  {% endfor %}
</div>
