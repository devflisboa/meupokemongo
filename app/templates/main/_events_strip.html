{# Eventos do GO em faixa deslizante (Início logado e página de apresentação) #}
<div class="flex gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-1 px-1" id="home-eventos">
  {% for ev in game_events %}
  <a href="{{ ev.url }}" target="_blank" rel="noopener"
    class="snap-start flex-shrink-0 w-64 bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow group">
    <div class="relative h-28 bg-gray-200 overflow-hidden">
      <img src="{{ ev.image_url }}" alt="{{ ev.title }}" loading="lazy"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
      <span class="absolute top-2 left-2 text-[10px] font-bold uppercase tracking-wide bg-black/50 text-white px-2 py-0.5 rounded-full">{{ ev.category }}</span>
      <p class="absolute bottom-2 left-3 right-3 text-white font-bold text-xs leading-tight line-clamp-2">{{ ev.title }}</p>
    </div>
    <div class="p-3">
      <div class="text-[10px] font-semibold text-gray-500">📅 {{ ev.date }}</div>
      <p class="text-xs text-gray-600 leading-snug mt-1 line-clamp-2">{{ ev.description }}</p>
    </div>
  </a>
  {% endfor %}
</div>
